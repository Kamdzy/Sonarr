name: Deploy

on:
  workflow_call:
    inputs:
      framework:
        description: ".net framework"
        type: string
        required: true
      branch:
        description: "Git branch used for this build"
        type: string
        required: true
      major_version:
        description: "Sonarr major version"
        type: string
        required: true
      version:
        description: "Sonarr version"
        type: string
        required: true

jobs:
  package:
    strategy:
      matrix:
        include:
          - runtime: linux-musl-x64
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Package
        uses: ./.github/actions/package
        with:
          framework: ${{ inputs.framework }}
          runtime: ${{ matrix.runtime }}
          artifact: build-${{ matrix.runtime }}
          branch: ${{ inputs.branch }}
          major_version: ${{ inputs.major_version }}
          version: ${{ inputs.version }}

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: _artifacts
          pattern: release-*
          merge-multiple: true

      - name: Get Previous Release
        id: previous-release
        uses: cardinalby/git-get-release-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseNameRegEx: '^${{ inputs.major_version }}\.'
          prerelease: ${{ inputs.branch != 'main' }}
          doNotFailIfNotFound: true

      - name: Generate Release Notes
        id: generate-release-notes
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          result-encoding: string
          script: |
            const previousTagName = '${{ steps.previous-release.outputs.tag_name }}'

            const { data } = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: 'v${{ inputs.version }}',
              target_commitish: '${{ github.sha }}',
              ...(previousTagName && { previous_tag_name: previousTagName }),
            })
            return data.body

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          artifacts: _artifacts/Sonarr.*
          commit: ${{ github.sha }}
          generateReleaseNotes: false
          body: ${{ steps.generate-release-notes.outputs.result }}
          name: ${{ inputs.version }}
          prerelease: ${{ inputs.branch != 'main' }}
          skipIfReleaseExists: true
          tag: v${{ inputs.version }}

      - name: Sleep for 30 seconds
        run: sleep 30s
        shell: bash

  docker-trigger:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: docker trigger event
        run: |
          curl -X POST --fail-with-body -H "Accept: application/vnd.github.v3+json" -H "Authorization: token ${{ secrets.REPOSITORY_ACCESS_TOKEN }}" -d '{"ref":"master", "inputs":{"version": "${{ inputs.version }}","framework": "${{ inputs.framework }}"}}' https://api.github.com/repos/kamdzy/docker-sonarr/actions/workflows/external_trigger_edited.yml/dispatches
